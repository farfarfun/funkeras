[project]
name = "funkeras"
version = "0.8.13"
description = "keras 相关模型、层与工具集合（attention、transformer、bert、yolo 等的学习与整理实现）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "tensorflow",
    "numpy",
    "scipy",
    "opencv-python",
    "pillow",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notekeras"]
