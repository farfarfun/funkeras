[project]
name = "funkeras"
version = "0.9.0"
description = "keras 相关模型、层与工具集合（attention、transformer、bert、yolo 等的学习与整理实现）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "tensorflow>=2.12",
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python>=4.6",
    "pillow>=9.0",
    "tqdm>=4.64",
    "typeguard>=2.13,<3",
    "farlog>=1.1.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `notekeras` 是废弃导入路径的兼容层（只有一个 __init__.py，转发到
# funkeras），保留到下一次破坏性版本再删除。
packages = ["src/funkeras", "src/notekeras"]
